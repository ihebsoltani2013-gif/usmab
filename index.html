<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>USMAB – اتحاد عين البيضاء</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{--bg:#fff;--ink:#000;--panel:#efeeee;--mute:#6d6d6d;--line:#d9d8d8;--inv:#fff;--onink:#fff;
--disp:"Barlow Condensed","Arial Narrow",Impact,sans-serif;--body:"Barlow",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--ink:#fff;--panel:#161616;--mute:#9a9a9a;--line:#2b2b2b;--onink:#000;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--ink:#fff;--panel:#161616;--mute:#9a9a9a;--line:#2b2b2b;--onink:#000;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--ink);z-index:10}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:var(--onink);display:flex;align-items:center;gap:12px;padding:10px 16px}
.top .tile{width:40px;height:40px;background:#fff;border-radius:8px;display:grid;place-items:center;flex:none}
.top img{width:34px;height:34px;object-fit:contain}
.top b{font:800 26px/1 var(--disp);letter-spacing:.04em}
.top span{margin-inline-start:auto;font:600 20px/1 var(--body);direction:rtl}
.stripes{height:14px;background:repeating-linear-gradient(90deg,#fff 0 28px,#000 28px 56px);border-block:2px solid var(--ink)}
main{max-width:560px;margin:0 auto;padding:0 16px}
section[hidden]{display:none}
h1,h2,h3{font-family:var(--disp);margin:0;line-height:1}
h2{font-size:30px;font-weight:800;margin:28px 0 12px}
.hero{padding:22px 0 8px}
.hero small{color:var(--mute);font-size:15px}
.hero h1{font-size:44px;font-weight:800;margin:4px 0 2px}
.count{display:grid;grid-template-columns:repeat(3,1fr);margin:16px 0;border-block:3px solid var(--ink)}
.count div{text-align:center;padding:10px 0 8px}
.count div+div{border-inline-start:3px solid var(--ink)}
.count b{display:block;font:800 64px/1 var(--disp);font-variant-numeric:tabular-nums}
.count i{font-style:normal;color:var(--mute);font-size:14px}
.row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.row .when{width:58px;flex:none;text-align:center;font:700 15px/1.1 var(--disp);color:var(--mute)}
.row .when b{display:block;font-size:30px;color:var(--ink)}
.row .vs{flex:1;min-width:0}.row .vs strong{display:block;font:700 22px/1.1 var(--disp)}
.row .vs small{color:var(--mute)}
.score{font:800 30px/1 var(--disp);padding:4px 10px;background:var(--ink);color:var(--onink);white-space:nowrap}
.pill{width:30px;height:30px;display:inline-grid;place-items:center;font:800 17px/1 var(--disp);border:2px solid var(--ink);border-radius:50%}
.pill.W{background:var(--ink);color:var(--onink)}.pill.L{border-style:dashed;color:var(--mute);border-color:var(--mute)}
.form{display:flex;gap:6px;align-items:center}
.seg{display:flex;border:2px solid var(--ink);margin-bottom:6px}
.seg button,.chips button{flex:1;font:700 18px/1 var(--disp);padding:11px 8px;border:0;background:var(--bg);color:var(--ink);cursor:pointer}
.seg button[aria-pressed=true],.chips button[aria-pressed=true]{background:var(--ink);color:var(--onink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
.chips button{flex:none;border:2px solid var(--ink);padding:9px 16px}
.squad{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.p{background:var(--panel);padding:12px 12px 14px;position:relative;overflow:hidden}
.p b{position:absolute;inset-inline-end:8px;top:-4px;font:800 72px/1 var(--disp);opacity:.14}
.p strong{display:block;font:700 22px/1.05 var(--disp);margin-top:34px}
.p small{color:var(--mute)}
article{border-bottom:1px solid var(--line);padding:16px 0}
article h3{font-size:25px;font-weight:700;line-height:1.05}
article small{color:var(--mute)}
article p{margin:8px 0 0;display:none}
article.open p{display:block}
article>button{all:unset;cursor:pointer;display:block;width:100%}
.note{margin:22px 0 0;padding:12px;background:var(--panel);color:var(--mute);font-size:14px}
nav{position:fixed;inset:auto 0 0;z-index:5;background:var(--ink);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--onink);opacity:.6;font:700 19px/1 var(--disp);padding:17px 4px 15px;cursor:pointer;border-top:4px solid transparent}
nav button[aria-selected=true]{opacity:1;border-top-color:var(--onink)}
button:focus-visible{outline:3px solid var(--mute);outline-offset:-3px}
@media (prefers-reduced-motion:no-preference){.count b{transition:opacity .2s}}
.count{grid-template-columns:repeat(2,1fr)}.rd{flex:1;text-align:center;align-self:center;font:800 22px/1 var(--disp)}.row.us{background:var(--panel);margin-inline:-8px;padding-inline:8px}.row.us strong{font-weight:800}.p strong{font:700 21px/1.2 var(--body)}.p b{font-size:64px;inset-inline-end:auto;inset-inline-start:8px;direction:ltr}.fb{display:block;text-align:center;text-decoration:none;background:var(--ink);color:var(--onink);font:700 19px/1 var(--disp);padding:14px 10px;margin-bottom:6px}article img{width:100%;height:auto;display:block;margin-top:10px}article h3{line-height:1.3}article p{line-height:1.7}.hero{margin-inline:-16px;padding:22px 16px 8px;min-height:calc(min(100vw,560px)*.8 + 340px);display:flex;flex-direction:column;justify-content:flex-end;color:#fff;background:linear-gradient(to top,#000 0,rgba(0,0,0,.85) 45%,rgba(0,0,0,0) 58%),var(--img) center top/100% auto no-repeat #000}
.hero small{color:#d6d6d6}.hero .count{border-color:#fff}.hero .count div+div{border-color:#fff}.hero .count i{color:#d6d6d6}.hero .seg{border-color:#fff;margin-bottom:14px}.hero .seg button{background:rgba(0,0,0,.55);color:#fff}.adm{margin:10px 0 18px;padding:12px;background:var(--panel);display:grid;gap:8px}.adm input,.adm textarea{font:16px var(--body);padding:10px;border:2px solid var(--ink);background:var(--bg);color:var(--ink);width:100%}.adm button{font:700 19px/1 var(--disp);padding:13px;border:0;background:var(--ink);color:var(--onink);cursor:pointer}.adm small{color:var(--mute)}article .adm{background:none;padding:0;margin:8px 0 0}article .adm button{background:none;color:var(--mute);border:2px solid var(--line);padding:8px}</style></head>

const T={IRBAA:"IRB A. Arnat",FCT:"FC Taher",MCBBS:"MCB B. Sakhra",EC:"E Collo",USMAB:"USMAB",IRBAL:"IRB A. Lahdjar",SCOR:"SC O. Rahmoune",ABCL:"AB C. Laid",JSMA:"JS Menzel Abtal",USORG:"USO R. Gare",NRBT:"NRB Teleghma",CRBKA:"CRB K. Abtal",CRAK:"CR A. Kebira",EBBS:"EB B. Sakhra",CRVM:"CR V. Moussa",ESAO:"ES A. Oualmane"};
const R=[
"IRBAA-FCT MCBBS-EC USMAB-IRBAL SCOR-ABCL JSMA-USORG NRBT-CRBKA CRAK-EBBS CRVM-ESAO",
"EBBS-CRVM CRBKA-CRAK USORG-NRBT IRBAL-JSMA FCT-SCOR EC-USMAB IRBAA-MCBBS ABCL-ESAO",
"MCBBS-FCT SCOR-EC NRBT-IRBAL JSMA-ABCL CRAK-USORG CRVM-CRBKA ESAO-EBBS USMAB-IRBAA",
"USORG-CRVM IRBAL-CRAK FCT-NRBT EC-JSMA IRBAA-SCOR MCBBS-USMAB ABCL-EBBS CRBKA-ESAO",
"USMAB-FCT NRBT-EC CRVM-IRBAL CRAK-ABCL ESAO-USORG EBBS-CRBKA SCOR-MCBBS JSMA-IRBAA",
"ABCL-CRVM FCT-CRAK IRBAA-NRBT MCBBS-JSMA USMAB-SCOR EC-CRBKA USORG-EBBS IRBAL-ESAO",
"CRVM-FCT CRAK-EC SCOR-IRBAL NRBT-ABCL CRBKA-USORG JSMA-USMAB EBBS-MCBBS ESAO-IRBAA",
"IRBAA-CRVM MCBBS-CRAK USMAB-NRBT SCOR-JSMA EC-USORG ABCL-CRBKA IRBAL-EBBS FCT-ESAO",
"JSMA-FCT EBBS-EC CRBKA-IRBAL USORG-ABCL NRBT-SCOR ESAO-USMAB CRVM-MCBBS CRAK-IRBAA",
"USMAB-CRVM SCOR-CRAK JSMA-NRBT EC-ABCL IRBAL-USORG FCT-CRBKA IRBAA-EBBS MCBBS-ESAO",
"EBBS-FCT CRVM-EC ABCL-IRBAL ESAO-JSMA USORG-SCOR CRAK-USMAB NRBT-MCBBS CRBKA-IRBAA",
"JSMA-CRVM NRBT-CRAK EC-IRBAL FCT-ABCL IRBAA-USORG MCBBS-CRBKA USMAB-EBBS SCOR-ESAO",
"IRBAL-FCT ESAO-EC CRVM-NRBT CRAK-JSMA EBBS-SCOR CRBKA-USMAB USORG-MCBBS ABCL-IRBAA",
"CRAK-CRVM FCT-EC IRBAA-IRBAL MCBBS-ABCL USMAB-USORG SCOR-CRBKA JSMA-EBBS NRBT-ESAO",
"USORG-FCT ESAO-CRAK EBBS-NRBT CRBKA-JSMA CRVM-SCOR ABCL-USMAB IRBAL-MCBBS EC-IRBAA"];
const base=R.map(r=>r.split(" ").map(x=>x.split("-")));
const all=[...base,...base.map(r=>r.map(([a,b])=>[b,a]))];
const mine=all.map((r,i)=>{const x=r.find(p=>p.includes("USMAB")),h=x[0]=="USMAB";return{n:i+1,h,o:h?x[1]:x[0]}});
const title=m=>m.h?"USMAB v "+T[m.o]:T[m.o]+" v USMAB";
let cur=3,view=3,mode="us";
try{cur=Math.min(30,Math.max(1,+localStorage.getItem("usmab-round")||3))}catch(e){}
const sd=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate());
const INFO={3:{t:new Date(2026,9,20),d:"Tuesday 20 October 2026",v:"ملعب منور معروف"}};
const when=m=>(m.h?"Home":"Away")+", "+(INFO[m.n]?INFO[m.n].d+', <span lang="ar" dir="rtl">'+INFO[m.n].v+"</span>":"date to be announced");
const mrow=m=>`<div class="row"><div class="when"><b>${m.n}</b>round</div><div class="vs"><strong>${title(m)}</strong><small>${when(m)}</small></div></div>`;
const card=(n,i,adm)=>`<article><button dir="rtl" aria-expanded="false"><small>${n[0]}${n[4]?", "+fmt(n[4],{day:"numeric",month:"short",year:"numeric"}):""}</small><h3 lang="ar">${n[1]}</h3><p lang="ar">${n[2]}${n[3]?`<img src="${IM[n[3]]||n[3]}" alt="">`:""}</p></button>${adm?`<div class="adm"><button data-del="${i}">Delete this post</button></div>`:""}</article>`;
function paintH(){const m=mine[cur-1],I=INFO[cur],dd=I?Math.max(0,Math.round((sd(I.t)-sd(new Date()))/864e5)):0;
home.innerHTML=`<div class="hero" style="--img:url(${BG})"><small>Régionale I, 2026–27, round ${cur} of 30</small><h1>${title(m)}</h1><small>${when(m)}</small>
<div class="count"${I?' style="grid-template-columns:repeat(3,1fr)"':""}>${I?`<div><b>${dd}</b><i>${dd==1?"day":"days"} to go</i></div>`:""}<div><b>${cur}</b><i>round</i></div><div><b>${m.h?"H":"A"}</b><i>${m.h?"home":"away"}</i></div></div>
<div class="seg"><button data-r="-1">Back a round</button><button data-r="1">Next round</button></div></div>
<h2>Coming up</h2>${mine.slice(cur,cur+3).map(mrow).join("")||"<p>The season is complete.</p>"}
<h2>Latest news</h2>${N.slice(0,2).map((n,i)=>card(n,i,0)).join("")}`}
function paintM(){ml.innerHTML=mode=="us"?mine.map(mrow).join(""):`<div class="seg"><button data-v="-1">Back</button><b class="rd">Round ${view}</b><button data-v="1">Forward</button></div>`+all[view-1].map(([a,b])=>`<div class="row${a=="USMAB"||b=="USMAB"?" us":""}"><div class="vs"><strong>${T[a]} v ${T[b]}</strong></div></div>`).join("")}
matches.innerHTML=`<h2>Matches</h2><div class="seg"><button aria-pressed="true" data-m="us">USMAB</button><button aria-pressed="false" data-m="all">All teams</button></div><div id="ml"></div>`;
paintH();paintM();
const pos=["All","GK","DEF","MID","FWD","STF"],lab={All:"All",GK:"Goalkeepers",DEF:"Defenders",MID:"Midfielders",FWD:"Forwards",STF:"Staff"},names={GK:"Goalkeeper",DEF:"Defender",MID:"Midfielder",FWD:"Forward"};
const sq=f=>P.filter(p=>f=="All"?p[1]!="STF":p[1]==f).map(p=>`<div class="p" dir="rtl"><b>${p[1]}</b><strong lang="ar">${p[0]}</strong><small>${p[2]||names[p[1]]}</small></div>`).join("");
squad.innerHTML=`<h2>Squad 2026–27</h2><div class="chips">${pos.map((p,i)=>`<button aria-pressed="${i==0}" data-f="${p}">${lab[p]}</button>`).join("")}</div><div class="squad" id="sl">${sq("All")}</div>`;
const form=`<div class="adm"><input id="an_t" placeholder="Label, for example Matchday or Signing"><input id="an_h" dir="auto" placeholder="Headline"><textarea id="an_b" dir="auto" rows="4" placeholder="Text"></textarea><input id="an_i" type="file" accept="image/*"><button id="an_go">Publish news</button><small id="an_s">Only you can see this form.</small></div>`;
function paintN(){document.getElementById("news").innerHTML=`<h2>News</h2><a class="fb" href="https://www.facebook.com/share/1DsPQa1uyG/" target="_blank" rel="noopener">Follow USMAB 1943 on Facebook</a>${ADMIN?form:""}${N.map((n,i)=>card(n,i,ADMIN)).join("")}`}
paintN();
const shrink=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const w=Math.min(900,im.width),c=document.createElement("canvas");c.width=w;c.height=Math.round(im.height*w/im.width);c.getContext("2d").drawImage(im,0,0,c.width,c.height);c.toBlob(x=>x?ok(x):no(new Error("image")),"image/jpeg",.82)};im.onerror=()=>no(new Error("image"));im.src=r.result};r.onerror=()=>no(new Error("image"));r.readAsDataURL(f)});
async function savePublish(list){const r=await fetch(location.href,{cache:"no-store"});const src=await r.text();const re=/(<script id="news-data" type="application\/json">)[\s\S]*?(<\/script>)/;if(!re.test(src))throw new Error("could not read the page");const j=JSON.stringify(list).replace(/</g,"\\u003c");await ART.publish(src.replace(re,(m,x,y)=>x+j+y))}
(async()=>{try{if(!window.claude)return;const u=await claude.use("user");if(!u||!(await u.canEdit()))return;ART=await claude.use("artifact");AS=await claude.use("assets");if(ART){ADMIN=true;paintN()}}catch(e){}})();
document.addEventListener("click",async e=>{const g=e.target.closest("#an_go"),d=e.target.closest("[data-del]");if(!g&&!d)return;const st=document.getElementById("an_s");
try{if(g){const h=an_h.value.trim();if(!h){st.textContent="Add a headline first.";return}
g.disabled=true;st.textContent="Publishing, the page will reload...";let img="";const f=an_i.files[0];if(f){const up=await AS.upload(await shrink(f));img="/_blob/"+up.id}
await savePublish([[an_t.value.trim()||"News",h,an_b.value.trim(),img,new Date().toISOString().slice(0,10)],...N])}
else{if(!d.dataset.sure){d.dataset.sure=1;d.textContent="Tap again to delete";return}d.disabled=true;await savePublish(N.filter((_,i)=>i!=d.dataset.del))}}
catch(x){if(g)g.disabled=false;(g?st:d).textContent="Could not publish: "+((x&&(x.message||x.code))||"error")}});;
document.addEventListener("click",e=>{
const t=e.target.closest("[data-t]");
if(t){document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",b==t));["home","matches","squad","news"].forEach(s=>document.getElementById(s).hidden=s!=t.dataset.t);scrollTo(0,0)}
const m=e.target.closest("[data-m]");
if(m){m.parentNode.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b==m));mode=m.dataset.m;view=cur;paintM()}
const v=e.target.closest("[data-v]");
if(v){view=Math.min(30,Math.max(1,view+ +v.dataset.v));paintM()}
const r=e.target.closest("[data-r]");
if(r){cur=Math.min(30,Math.max(1,cur+ +r.dataset.r));try{localStorage.setItem("usmab-round",cur)}catch(x){}paintH()}
const f=e.target.closest("[data-f]");
if(f){f.parentNode.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b==f));sl.innerHTML=sq(f.dataset.f)}
const a=e.target.closest("article>button");
if(a){const o=a.parentNode.classList.toggle("open");a.setAttribute("aria-expanded",o);a.querySelector("p").style.display=o?"block":"none"}});
(async()=>{try{const t=await(await fetch(location.href,{cache:"no-store"})).text(),m=t.match(/id="news-data" type="application\/json">([\s\S]*?)<\/script>/);if(!m)return;const d=JSON.parse(m[1]);if(JSON.stringify(d)!==JSON.stringify(N)){N.splice(0,N.length,...d);paintN();paintH()}}catch(e){}})();
</script></body></html>
