<style>
:root{--bg:#fff;--ink:#000;--panel:#efeeee;--mute:#6d6d6d;--line:#d9d8d8;--inv:#fff;--onink:#fff;
--disp:"Barlow Condensed","Arial Narrow",Impact,sans-serif;--body:"Barlow",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--ink:#fff;--panel:#161616;--mute:#9a9a9a;--line:#2b2b2b;--onink:#000;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--ink:#fff;--panel:#161616;--mute:#9a9a9a;--line:#2b2b2b;--onink:#000;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--ink);z-index:10}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:var(--onink);display:flex;align-items:center;gap:12px;padding:10px 16px}
.top .tile{width:40px;height:40px;background:#fff;border-radius:8px;display:grid;place-items:center;flex:none}
.top img{width:34px;height:34px;object-fit:contain}
.top b{font:800 26px/1 var(--disp);letter-spacing:.04em}
.top span{margin-inline-start:auto;font:600 20px/1 var(--body);direction:rtl}
.stripes{height:14px;background:repeating-linear-gradient(90deg,#fff 0 28px,#000 28px 56px);border-block:2px solid var(--ink)}
main{max-width:560px;margin:0 auto;padding:0 16px}
section[hidden]{display:none}
h1,h2,h3{font-family:var(--disp);margin:0;line-height:1}
h2{font-size:30px;font-weight:800;margin:28px 0 12px}
.hero{padding:22px 0 8px}
.hero small{color:var(--mute);font-size:15px}
.hero h1{font-size:44px;font-weight:800;margin:4px 0 2px}
.count{display:grid;grid-template-columns:repeat(3,1fr);margin:16px 0;border-block:3px solid var(--ink)}
.count div{text-align:center;padding:10px 0 8px}
.count div+div{border-inline-start:3px solid var(--ink)}
.count b{display:block;font:800 64px/1 var(--disp);font-variant-numeric:tabular-nums}
.count i{font-style:normal;color:var(--mute);font-size:14px}
.row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.row .when{width:58px;flex:none;text-align:center;font:700 15px/1.1 var(--disp);color:var(--mute)}
.row .when b{display:block;font-size:30px;color:var(--ink)}
.row .vs{flex:1;min-width:0}.row .vs strong{display:block;font:700 22px/1.1 var(--disp)}
.row .vs small{color:var(--mute)}
.score{font:800 30px/1 var(--disp);padding:4px 10px;background:var(--ink);color:var(--onink);white-space:nowrap}
.pill{width:30px;height:30px;display:inline-grid;place-items:center;font:800 17px/1 var(--disp);border:2px solid var(--ink);border-radius:50%}
.pill.W{background:var(--ink);color:var(--onink)}.pill.L{border-style:dashed;color:var(--mute);border-color:var(--mute)}
.form{display:flex;gap:6px;align-items:center}
.seg{display:flex;border:2px solid var(--ink);margin-bottom:6px}
.seg button,.chips button{flex:1;font:700 18px/1 var(--disp);padding:11px 8px;border:0;background:var(--bg);color:var(--ink);cursor:pointer}
.seg button[aria-pressed=true],.chips button[aria-pressed=true]{background:var(--ink);color:var(--onink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
.chips button{flex:none;border:2px solid var(--ink);padding:9px 16px}
.squad{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.p{background:var(--panel);padding:12px 12px 14px;position:relative;overflow:hidden}
.p b{position:absolute;inset-inline-end:8px;top:-4px;font:800 72px/1 var(--disp);opacity:.14}
.p strong{display:block;font:700 22px/1.05 var(--disp);margin-top:34px}
.p small{color:var(--mute)}
article{border-bottom:1px solid var(--line);padding:16px 0}
article h3{font-size:25px;font-weight:700;line-height:1.05}
article small{color:var(--mute)}
article p{margin:8px 0 0;display:none}
article.open p{display:block}
article>button{all:unset;cursor:pointer;display:block;width:100%}
.note{margin:22px 0 0;padding:12px;background:var(--panel);color:var(--mute);font-size:14px}
nav{position:fixed;inset:auto 0 0;z-index:5;background:var(--ink);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--onink);opacity:.6;font:700 19px/1 var(--disp);padding:17px 4px 15px;cursor:pointer;border-top:4px solid transparent}
nav button[aria-selected=true]{opacity:1;border-top-color:var(--onink)}
button:focus-visible{outline:3px solid var(--mute);outline-offset:-3px}
@media (prefers-reduced-motion:no-preference){.count b{transition:opacity .2s}}

let lang="ar",tab="home",flt="All",mode="us",RES={},RD={},stored=null;
try{lang=localStorage.getItem("usmab-lang")||"ar";stored=+localStorage.getItem("usmab-round")||null}catch(e){}
let cur=stored||3,view=cur;
const t=k=>L[lang][k];
const fmt=(x,o)=>new Date(x).toLocaleString(lang=="ar"?"ar-DZ-u-nu-latn":"en-GB",o);
const DF={weekday:"long",day:"numeric",month:"long",year:"numeric"};
const sd=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate());
const nm=k=>k=="USMAB"&&lang=="ar"?"اتحاد عين البيضاء":T[k];
const tt=(a,b)=>"<bdi>"+nm(a)+"</bdi>"+t("vs")+"<bdi>"+nm(b)+"</bdi>";
const mine=all.map((r,ri)=>{const i=r.findIndex(p=>p.includes("USMAB")),x=r[i],h=x[0]=="USMAB";return{n:ri+1,i,h,o:h?x[1]:x[0]}});
const ttl=m=>m.h?tt("USMAB",m.o):tt(m.o,"USMAB");
const score=(n,i)=>{const s=(RES[n]||[])[i],m=s&&s.match(/^(\d+)-(\d+)$/);return m?[+m[1],+m[2]]:null};
const sco=m=>score(m.n,m.i);
const wdl=m=>{const s=sco(m),u=m.h?s[0]:s[1],o=m.h?s[1]:s[0];return u>o?"W":u<o?"L":"D"};
const firstOpen=()=>{const m=mine.find(x=>!sco(x));return m?m.n:30};
const INFO={3:{t:new Date(2026,9,20),v:"ملعب منور معروف"}};
const dt=n=>RD[n]?new Date(RD[n]+"T00:00:00"):(INFO[n]?INFO[n].t:null);
const when=m=>{const s=sco(m),d=dt(m.n),v=INFO[m.n]?INFO[m.n].v:"";return (m.h?t("home"):t("away"))+(s?"":", "+(d?fmt(d,DF)+(v?', <bdi lang="ar">'+v+"</bdi>":""):t("tba")))};
const badge=m=>{const s=sco(m);return s?`<span class="score" dir="ltr">${s[0]} – ${s[1]}</span>`:""};
const mrow=m=>`<div class="row"><div class="when"><b>${m.n}</b>${t("round")}</div><div class="vs"><strong>${ttl(m)}</strong><small>${when(m)}</small></div>${badge(m)}</div>`;
function standings(){const tm={};Object.keys(T).forEach(k=>tm[k]={k,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});
all.forEach((r,ri)=>r.forEach(([a,b],i)=>{const s=score(ri+1,i);if(!s)return;const A=tm[a],B=tm[b];A.p++;B.p++;A.gf+=s[0];A.ga+=s[1];B.gf+=s[1];B.ga+=s[0];if(s[0]>s[1]){A.w++;A.pts+=3;B.l++}else if(s[0]<s[1]){B.w++;B.pts+=3;A.l++}else{A.d++;B.d++;A.pts++;B.pts++}}));
return Object.values(tm).sort((x,y)=>y.pts-x.pts||(y.gf-y.ga)-(x.gf-x.ga)||y.gf-x.gf||x.k.localeCompare(y.k))}
const card=n=>`<article><button dir="rtl" aria-expanded="false"><small>${n[0]}${n[4]?", "+fmt(n[4],{day:"numeric",month:"short",year:"numeric"}):""}</small><h3 lang="ar">${n[1]}</h3><p lang="ar">${n[2]}${n[3]?`<img src="${IM[n[3]]||n[3]}" alt="">`:""}</p></button></article>`;
function paintH(){const m=mine[cur-1],d=dt(cur),dd=d?Math.max(0,Math.round((sd(d)-sd(new Date()))/864e5)):0,pl=mine.filter(sco),tb=standings(),pos=tb.findIndex(x=>x.k=="USMAB")+1;
$("home").innerHTML=`<div class="hero"><small>${t("league")(cur)}</small><h1>${ttl(m)}</h1><small>${when(m)}</small>
<div class="count" style="grid-template-columns:repeat(${d?2:1},1fr)">${d?`<div><b>${dd}</b><i>${dd==1?t("day1"):t("days")}</i></div>`:""}<div><b>${cur}</b><i>${t("round")}</i></div></div>
<div class="seg"><button data-r="-1">${t("prev")}</button><button data-r="1">${t("next")}</button></div></div>
${lineupHtml()}
${pl.length?`<h2>${t("form")}</h2><div class="form">${pl.slice(-5).map(x=>`<span class="pill ${wdl(x)}">${t(wdl(x))}</span>`).join("")}</div><p class="rk">${t("rank")(pos,tb[pos-1].pts)}</p>`:""}
<h2>${t("soon")}</h2>${mine.slice(cur,cur+3).map(mrow).join("")||`<p>${t("done")}</p>`}
<h2>${t("latest")}</h2>${N.slice(0,2).map(card).join("")}`}
function paintM(){$("matches").innerHTML=`<h2>${t("mt")}</h2><div class="seg"><button data-m="us" aria-pressed="${mode=="us"}">${t("us")}</button><button data-m="all" aria-pressed="${mode=="all"}">${t("allT")}</button></div>`+(mode=="us"?mine.map(mrow).join(""):`<div class="seg"><button data-v="-1">${t("back")}</button><b class="rd">${t("rd")} ${view}</b><button data-v="1">${t("fwd")}</button></div>`+all[view-1].map(([a,b],i)=>{const s=score(view,i);return `<div class="row${a=="USMAB"||b=="USMAB"?" us":""}"><div class="vs"><strong>${tt(a,b)}</strong></div>${s?`<span class="score" dir="ltr">${s[0]} – ${s[1]}</span>`:""}</div>`}).join(""))}
function paintT(){const tb=standings();$("tbl").innerHTML=`<h2>${t("tbl")}</h2>${Object.keys(RES).length?"":`<p class="rk">${t("noRes")}</p>`}<div class="tw"><table><thead><tr>${t("cols").map((c,i)=>`<th${i==1?' class="n"':""}>${c}</th>`).join("")}</tr></thead><tbody>${tb.map((x,i)=>`<tr class="${x.k=="USMAB"?"us":""}"><td>${i+1}</td><td class="n"><bdi>${nm(x.k)}</bdi></td><td>${x.p}</td><td>${x.w}</td><td>${x.d}</td><td>${x.l}</td><td dir="ltr">${x.gf>x.ga?"+":""}${x.gf-x.ga}</td><td><b>${x.pts}</b></td></tr>`).join("")}</tbody></table></div>`}
function paintS(){const pl=P.filter(p=>flt=="All"?p[1]!="STF":p[1]==flt);$("squad").innerHTML=`<h2>${t("sq")}</h2><div class="chips">${["All","GK","DEF","MID","FWD","STF"].map(p=>`<button aria-pressed="${p==flt}" data-f="${p}">${t("c_"+p)}</button>`).join("")}</div><div class="squad">${pl.map(p=>`<div class="p${p[4]?" ph":""}" dir="rtl">${p[4]?`<img src="${p[4]}" alt="" loading="lazy">`:""}<b>${esc(p[3]||p[1])}</b><strong lang="ar">${p[0]}</strong><small>${p[2]?(lang=="ar"?(ROLE[p[2]]||p[2]):p[2]):t("p_"+p[1])}</small></div>`).join("")}</div>`}
function paintN(){$("news").innerHTML=`<h2>${t("news")}</h2><a class="fb" href="https://www.facebook.com/share/1DsPQa1uyG/" target="_blank" rel="noopener">${t("fb")}</a>${N.map(card).join("")}`}
const TABS=["home","matches","tbl","squad","news","club"];
function showTab(){TABS.forEach(id=>$(id).hidden=id!=tab);document.querySelectorAll("#nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.t==tab))}
function paintAll(){document.documentElement.lang=lang;document.documentElement.dir=lang=="ar"?"rtl":"ltr";$("lg").textContent=lang=="ar"?"EN":"عربي";$("note").textContent=t("note");
$("nav").innerHTML=TABS.map(id=>`<button role="tab" data-t="${id}">${t("nav_"+({tbl:"table"}[id]||id))}</button>`).join("");showTab();paintH();paintM();paintT();paintS();paintN();paintC();loadLive()}
document.addEventListener("click",e=>{const c=s=>e.target.closest(s);let x;
if(c("#lg")){lang=lang=="ar"?"en":"ar";try{localStorage.setItem("usmab-lang",lang)}catch(_){}paintAll();return}
if(x=c("[data-t]")){tab=x.dataset.t;showTab();scrollTo(0,0);return}
if(x=c("[data-m]")){mode=x.dataset.m;view=cur;paintM();return}
if(x=c("[data-v]")){view=Math.min(30,Math.max(1,view+ +x.dataset.v));paintM();return}
if(x=c("[data-r]")){cur=Math.min(30,Math.max(1,cur+ +x.dataset.r));stored=cur;try{localStorage.setItem("usmab-round",cur)}catch(_){}paintH();return}
if(x=c("[data-f]")){flt=x.dataset.f;paintS();return}
if(c("#ins")&&DP){DP.prompt();DP=null;paintC();return}
if(x=c("article>button")){const o=x.parentNode.classList.toggle("open");x.setAttribute("aria-expanded",o);x.querySelector("p").style.display=o?"block":"none"}});
const parseRes=txt=>{const r={},d={};txt.split(/\r?\n/).forEach(l=>{const m=l.match(/^\s*(\d+)\s*:\s*(.*)$/);if(m){const k=m[2].trim().split(/\s+/);r[+m[1]]=k.filter(x=>x[0]!="@");const a=k.find(x=>x[0]=="@");if(a)d[+m[1]]=a.slice(1)}});return[r,d]};
async function loadLive(){const B=$("live");try{const r=await fetch("live.txt?t="+Date.now(),{cache:"no-store"});if(!r.ok){B.hidden=true;return}const o={};(await r.text()).split(/\r?\n/).forEach(l=>{const m=l.match(/^(\w+):\s*(.*)$/);if(m)o[m[1].toLowerCase()]=m[2].trim()});if(o.status!="live"){B.hidden=true;return}const u=esc(o.us||"0"),h=esc(o.them||"0"),p=esc(o.opponent||"");B.innerHTML="<b>"+t("live")+"</b><span dir=\"auto\">"+(o.home=="no"?p+" "+h+" - "+u+" USMAB":"USMAB "+u+" - "+h+" "+p)+"</span><i>"+esc(o.minute||"")+"</i>";B.hidden=false}catch(e){B.hidden=true}}
let DP=null;
let INF={about:"",stadium:"ملعب منور معروف",mapq:"",tickets:[],links:["فيسبوك | https://www.facebook.com/share/1DsPQa1uyG/"],sponsors:[]};
const sp=l=>{const i=l.indexOf("|");return i<0?[l.trim(),""]:[l.slice(0,i).trim(),l.slice(i+1).trim()]};
const okUrl=u=>/^(https?:\/\/|tel:|mailto:)/i.test(u);
function paintC(){const q=INF.mapq||(INF.stadium?INF.stadium+" عين البيضاء":"");
$("club").innerHTML=`<h2>${t("club")}</h2><div class="about"><img src="${LOGO}" alt=""><div><strong>${nm("USMAB")}</strong><small>${t("since")}</small></div></div>`
+(INF.about?`<p class="ab" lang="ar" dir="auto">${esc(INF.about).replace(/\n/g,"<br>")}</p>`:"")
+(INF.stadium?`<h2>${t("stad")}</h2><div class="card2"><strong lang="ar">${esc(INF.stadium)}</strong>${q?`<a class="fb" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}">${t("map")}</a>`:""}</div>`:"")
+(INF.tickets.length?`<h2>${t("tix")}</h2>`+INF.tickets.map(l=>{const[a,b]=sp(l);return `<div class="row"><div class="vs"><strong lang="ar">${esc(a)}</strong></div>${b?`<span class="score" dir="auto">${esc(b)}</span>`:""}</div>`}).join(""):"")
+(INF.links.length?`<h2>${t("lnk")}</h2>`+INF.links.map(sp).filter(x=>okUrl(x[1])).map(([a,u])=>`<a class="fb" target="_blank" rel="noopener" href="${esc(u)}">${esc(a)}</a>`).join(""):"")
+(INF.sponsors.length?`<h2>${t("spn")}</h2>`+INF.sponsors.map(l=>{const[a,u]=sp(l);return `<div class="row"><div class="vs"><strong lang="ar">${okUrl(u)?`<a href="${esc(u)}" target="_blank" rel="noopener" style="color:inherit">${esc(a)}</a>`:esc(a)}</strong></div></div>`}).join(""):"")
+`<h2>${t("inst")}</h2><p class="rk">${t("instTxt")}</p>${DP?`<button class="fb" id="ins">${t("instBtn")}</button>`:""}`}
addEventListener("beforeinstallprompt",e=>{e.preventDefault();DP=e;paintC()});
let LU=null;
function lineupHtml(){if(!LU||!Array.isArray(LU.xi)||LU.xi.length!=11)return"";
const rows=String(LU.formation||"4-4-2").split("-").map(Number);if(rows.reduce((a,b)=>a+b,0)!=10||rows.some(n=>!(n>0)))return"";
const k=rows.length,pts=[[50,90,LU.xi[0],1]];let c=1;
rows.forEach((n,ri)=>{const y=k>1?72-ri*(58/(k-1)):45;for(let j=0;j<n;j++)pts.push([(j+1)/(n+1)*100,y,LU.xi[c++],n])});
const mk=([x,y,p,n])=>`<div class="pl" style="left:${x}%;top:${y}%;width:${(100/(n+.8)).toFixed(1)}%"><i>${p.img?`<img src="${esc(p.img)}" alt="">`:esc(p.num||p.p||"")}</i><span lang="ar">${esc(p.n)}</span></div>`;
const m=mine[(+LU.round||cur)-1],sb=Array.isArray(LU.subs)?LU.subs:[];
return `<h2>${t("lu")}</h2>${m?`<p class="rk">${t("rd")} ${+LU.round||cur}: ${ttl(m)}</p>`:""}<div class="pitch">${pts.map(mk).join("")}</div>`
+(sb.length?`<h3 class="sh">${t("subs")}</h3><div class="subs">${sb.map(p=>`<span>${p.num?`<b>${esc(p.num)}</b>`:""}<bdi lang="ar">${esc(p.n)}</bdi></span>`).join("")}</div>`:"")
+(LU.coach?`<p class="rk">${t("coach")}: <bdi lang="ar">${esc(LU.coach)}</bdi></p>`:"")}
paintAll();
(async()=>{try{const r=await fetch("news.txt?t="+Date.now(),{cache:"no-store"});if(!r.ok)return;const Q=parseNews(await r.text());if(Q.length){N.splice(0,N.length,...Q);paintN();paintH()}}catch(e){}})();
(async()=>{try{const r=await fetch("results.txt?t="+Date.now(),{cache:"no-store"});if(!r.ok)return;[RES,RD]=parseRes(await r.text());if(!stored){cur=firstOpen();view=cur}paintH();paintM();paintT()}catch(e){}})();
(async()=>{try{const r=await fetch("info.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)return;const j=await r.json();["about","stadium","mapq"].forEach(k=>{if(typeof j[k]=="string")INF[k]=j[k]});["tickets","links","sponsors"].forEach(k=>{if(Array.isArray(j[k]))INF[k]=j[k].map(String)});paintC()}catch(e){}})();
if(typeof navigator!="undefined"&&"serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
(async()=>{try{const r=await fetch("squad.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)return;const j=await r.json();if(Array.isArray(j)&&j.length){P.length=0;j.forEach(x=>P.push([String(x.n||""),String(x.p||"MID"),String(x.r||""),String(x.num||""),String(x.img||"").replace(/["<>]/g,"")]));paintS()}}catch(e){}})();
(async()=>{try{const r=await fetch("lineup.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)return;const j=await r.json();LU=j&&Array.isArray(j.xi)?j:null;paintH()}catch(e){}})();
setInterval(loadLive,45000);
</script></body></html>
